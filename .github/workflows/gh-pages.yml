name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  # The platform this study previews. Its config is generated in CI (configs
  # are gitignored) and must exist before the wheel is built — the validator
  # reads it from the installed package, not the checkout.
  PREVIEW_PLATFORM: chatgpt

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Generate Platform Config
        run: python3 scripts/generate_port_config.py "$PREVIEW_PLATFORM"

      - name: Build Python Package
        working-directory: packages/python
        run: |
          poetry lock
          poetry install
          poetry build --format wheel

      - name: Install Node Dependencies
        run: pnpm install

      - name: Copy Python Wheel
        run: |
          mkdir -p packages/data-collector/public
          cp packages/python/dist/*.whl packages/data-collector/public/

      - name: Build App
        run: pnpm run build
        env:
          VITE_PLATFORM: ${{ env.PREVIEW_PLATFORM }}
          VITE_STANDALONE: "true"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/data-collector/dist
